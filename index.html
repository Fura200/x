<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テンプレート</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #f0f8ff;
            color: #333;
        }
        h1 {
            color: #007bff;
        }
        /* 入力パーツを見やすくするための少しの隙間 */
        input, button {
            padding: 8px 12px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1 id="title">名前を入力してね</h1>
    
    <!-- 入力するための箱とボタン -->
    <input type="text" id="nameInput" placeholder="ここに名前を入力">
    <button id="submitBtn">決定</button>

    <script src="script.js"></script>
</body>
</html>
